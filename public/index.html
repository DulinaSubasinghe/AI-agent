<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>B2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<style>
:root{--bg:#080b14;--surface:#0e1220;--surface2:#141928;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#e8edf5;--muted:#70809d;--accent:#7c6aff;--accent-dim:rgba(124,106,255,.12);--user:#ff7c5c;--ok:#4fd1c7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:row;}
button,input,textarea{font:inherit}
.sidebar{width:230px;min-width:230px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;color:#fff;flex-shrink:0}
.logo-name{font-size:14px;font-weight:600}.logo-sub{font-size:10px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.new-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text);font-size:13px;cursor:pointer;transition:.15s;margin-bottom:8px}
.new-btn:hover,.urow:hover,.citem:hover{background:var(--surface2);color:var(--text)}
.new-icon{width:16px;height:16px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;line-height:1;flex-shrink:0}
.sec{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;padding:8px 8px 4px}
.recent-list{min-height:0;overflow:auto}.recent-list::-webkit-scrollbar{width:3px}.recent-list::-webkit-scrollbar-thumb{background:var(--surface2)}
.citem{width:100%;padding:7px 8px;border:0;border-radius:6px;background:transparent;font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;text-align:left}
.citem.on{background:var(--accent-dim);color:var(--text);border:1px solid rgba(124,106,255,.22)}
.cdot{width:4px;height:4px;border-radius:50%;background:var(--muted);flex-shrink:0}.citem.on .cdot{background:var(--accent)}
.sb-foot{position:relative;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.urow{width:100%;display:flex;align-items:center;gap:9px;padding:7px 8px;border:0;background:transparent;border-radius:7px;color:var(--text);cursor:pointer;transition:.15s;text-align:left}
.uav{width:26px;height:26px;border-radius:50%;background:var(--user);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0}
.uname{font-size:13px;font-weight:500}.uplan{font-size:11px;color:var(--muted)}
.profile-menu{position:absolute;left:0;right:0;bottom:50px;padding:12px;background:#101626;border:1px solid var(--border2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.profile-menu[hidden]{display:none}.profile-menu label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.profile-menu input,.search-box input{width:100%;background:#090d18;border:1px solid var(--border2);border-radius:8px;color:var(--text);outline:none;padding:9px 10px;font-size:16px}
.profile-menu input:focus,.search-box input:focus,.comp textarea:focus{border-color:rgba(124,106,255,.5)}
.profile-actions{display:flex;gap:7px;margin-top:9px}.small-btn{flex:1;border:1px solid var(--border2);border-radius:7px;background:var(--surface2);color:var(--text);padding:7px;cursor:pointer;font-size:12px}.small-btn.primary{background:var(--accent);border-color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
.hdr{height:50px;min-height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:rgba(8,11,20,.85);flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden}.hdr-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mbadge{font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--ok);background:rgba(79,209,199,.08);border:1px solid rgba(79,209,199,.18);padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.hdr-r{display:flex;gap:6px;flex-shrink:0}.ibtn{width:32px;height:32px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0}.ibtn:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}.ibtn.danger:hover{border-color:rgba(255,124,92,.55);color:#ffb3a4;background:rgba(255,124,92,.1)}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}.msgs::-webkit-scrollbar{width:3px}.msgs::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}
.mwrap{max-width:660px;margin:0 auto;padding:0 14px}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:10px;text-align:center;padding:20px}
.eorb{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:2px}.empty h2{font-size:20px;font-weight:600}.empty p{font-size:13px;color:var(--muted);max-width:300px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:6px}.chip{font-size:12px;padding:5px 13px;border:1px solid var(--border2);border-radius:20px;color:var(--muted);background:var(--surface);cursor:pointer;transition:.15s}.chip:hover{border-color:rgba(124,106,255,.4);color:var(--text);background:var(--accent-dim)}
.msg{margin-bottom:18px}.mhdr{display:flex;align-items:center;gap:7px;margin-bottom:6px}.mav{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0}
.mav.ai{background:var(--accent);color:#fff;font-family:"JetBrains Mono",monospace}.mav.user{background:var(--user);color:#fff}.mname{font-size:12px;font-weight:500;color:var(--muted)}.mtime{font-size:10px;color:var(--muted);margin-left:auto;font-family:"JetBrains Mono",monospace}
.mbody{padding:11px 15px;border-radius:10px;font-size:14px;line-height:1.7;color:var(--text);margin-left:29px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.msg.ai .mbody{background:var(--surface);border:1px solid var(--border);border-top-left-radius:3px}.msg.user .mbody{background:var(--accent-dim);border:1px solid rgba(124,106,255,.18);border-top-left-radius:3px}
.tdots{display:flex;gap:5px;padding:3px 0}.tdots span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.2s ease-in-out infinite}.tdots span:nth-child(2){animation-delay:.2s}.tdots span:nth-child(3){animation-delay:.4s}@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.comp-wrap{padding:10px 14px 16px;background:linear-gradient(to top,var(--bg) 65%,transparent);flex-shrink:0}.comp{max-width:660px;margin:0 auto;background:var(--surface);border:1px solid var(--border2);border-radius:13px;display:flex;flex-direction:column;transition:.2s;overflow:hidden}.comp:focus-within{border-color:rgba(124,106,255,.45)}
.comp textarea{background:transparent;border:none;outline:none;resize:none;padding:13px 15px 6px;color:var(--text);font-size:16px;line-height:1.6;min-height:50px;max-height:150px;-webkit-text-size-adjust:100%}.comp textarea::placeholder{color:var(--muted)}
.comp-foot{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 9px 13px}.hints{display:flex;gap:5px}.htag{font-size:10px;font-family:"JetBrains Mono",monospace;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);padding:2px 7px;border-radius:4px}
.sbtn{width:36px;height:36px;background:var(--accent);border:none;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}.sbtn:hover{opacity:.85}.sbtn:active{transform:scale(.93)}.sbtn:disabled{opacity:.28;cursor:not-allowed;transform:none}.sbtn svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.comp-note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;max-width:660px;margin-left:auto;margin-right:auto}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:10}.overlay[hidden]{display:none}.search-box{width:min(620px,100%);background:#101626;border:1px solid var(--border2);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.5);padding:14px}
.search-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.search-head strong{font-size:14px}.search-close{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}.search-results{margin-top:12px;max-height:55vh;overflow:auto}.sres{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:10px;margin-bottom:8px;text-align:left;cursor:pointer}.sres:hover{border-color:rgba(124,106,255,.42)}.sres-title{font-size:13px;font-weight:600}.sres-text{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}.empty-results{color:var(--muted);font-size:13px;padding:10px}
/* 3D VIEWER */
.model-card{margin-left:29px;margin-top:10px;border:1px solid rgba(124,106,255,.3);border-radius:10px;overflow:hidden;background:var(--surface2)}
.model-canvas-wrap{width:100%;height:280px;position:relative;cursor:grab}.model-canvas-wrap:active{cursor:grabbing}
.model-canvas-wrap canvas{width:100%!important;height:100%!important;display:block}
.model-label{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--border)}
.model-label span{font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--muted)}
.model-actions{display:flex;gap:6px}
.model-btn{font-size:11px;padding:4px 10px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:var(--text);cursor:pointer;transition:.15s}.model-btn:hover{background:var(--accent);border-color:var(--accent)}
.model-hint{font-size:10px;color:var(--muted);padding:0 12px 8px;font-family:"JetBrains Mono",monospace}
@media(max-width:680px){.sidebar{display:none}.hints{display:none}.mbadge{display:none}.comp-note{display:none}.mbody{font-size:15px}.model-canvas-wrap{height:220px}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">
    <div class="logo-mark">B2</div>
    <div>
      <div class="logo-name">B2</div>
      <div class="logo-sub">groq · 3d</div>
    </div>
  </div>
  <button class="new-btn" onclick="newChat()"><div class="new-icon">+</div> New conversation</button>
  <div class="sec">Recent</div>
  <div class="recent-list" id="recentList"></div>
  <div class="sb-foot">
    <button class="urow" id="profileBtn" onclick="toggleProfile()">
      <div class="uav" id="profileInitial">Y</div>
      <div>
        <div class="uname" id="profileName">You</div>
        <div class="uplan">Local profile</div>
      </div>
    </button>
    <div class="profile-menu" id="profileMenu" hidden>
      <label for="usernameInput">Username</label>
      <input id="usernameInput" maxlength="24" placeholder="Your username">
      <div class="profile-actions">
        <button class="small-btn primary" onclick="saveProfile()">Save</button>
        <button class="small-btn" onclick="toggleProfile(false)">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="hdr">
    <div class="hdr-l">
      <div class="hdr-title" id="chatTitle">New chat</div>
      <div class="mbadge">llama-3.3-70b</div>
    </div>
    <div class="hdr-r">
      <button class="ibtn" title="Clear current chat" onclick="clearCurrentChat()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
      </button>
      <button class="ibtn danger" title="Delete current chat" onclick="deleteCurrentChat()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M4 7h16"/><path d="M6 7l1 14h10l1-14"/><path d="M9 7V4h6v3"/></svg>
      </button>
      <button class="ibtn" title="Search chats" onclick="openSearch()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="ibtn" title="Profile" onclick="toggleProfile()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </button>
    </div>
  </div>

  <div class="msgs" id="msgs"><div class="mwrap" id="mwrap"></div></div>

  <div class="comp-wrap">
    <div class="comp">
      <textarea id="inp" placeholder="Message B2... or try 'generate a 3D red sphere'" rows="1" onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <div class="comp-foot">
        <div class="hints">
          <span class="htag">Ctrl K search</span>
          <span class="htag">Enter send</span>
          <span class="htag">Shift Enter newline</span>
        </div>
        <button class="sbtn" id="sbtn" onclick="send()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div class="comp-note">B2 can make mistakes. Verify important info.</div>
  </div>
</div>

<div class="overlay" id="searchOverlay" hidden onclick="closeSearch(event)">
  <div class="search-box" onclick="event.stopPropagation()">
    <div class="search-head">
      <strong>Search chats</strong>
      <button class="search-close" onclick="closeSearch()">x</button>
    </div>
    <input id="searchInput" placeholder="Search titles and messages..." oninput="renderSearchResults()">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script>
const API_BASE = "";
let chats = [], activeChatId = "", profile = { username: "You" }, busy = false;

function uid(){return crypto.randomUUID ? crypto.randomUUID() : String(Date.now());}
function gt(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function getActiveChat(){return chats.find(c=>c.id===activeChatId);}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}
function resize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,150)+"px";}

// ─── 3D DETECTION ───────────────────────────────────────────────
const IS_3D = /\b(generate|create|make|build|show|render)\b.{0,40}\b(3d|three[\s-]?d|model|object|shape|mesh|sphere|cube|cylinder|torus|pyramid|cone|box|ring|crystal|sword|chair|table|car|tree|house|rocket|robot)\b/i;
function is3DRequest(txt){ return IS_3D.test(txt); }

// ─── 3D VIEWER ───────────────────────────────────────────────────
let viewerCount = 0;

function create3DViewer(code, label) {
  const id = "v" + (++viewerCount);
  const wrap = document.createElement("div");
  wrap.className = "model-card";
  wrap.innerHTML = `
    <div class="model-canvas-wrap" id="cw-${id}"></div>
    <div class="model-hint">Drag to rotate · Scroll to zoom</div>
    <div class="model-label">
      <span>✦ ${escapeHtml(label)}</span>
      <div class="model-actions">
        <button class="model-btn" onclick="downloadModel('${id}')">⬇ Download .glb</button>
      </div>
    </div>`;
  setTimeout(() => bootViewer(id, code), 50);
  return wrap;
}

function bootViewer(id, code) {
  const container = document.getElementById("cw-" + id);
  if (!container) return;
  const w = container.clientWidth || 600;
  const h = container.clientHeight || 280;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1220);
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.set(0, 1.5, 4);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(5, 8, 5); dir.castShadow = true; scene.add(dir);
  const fill = new THREE.DirectionalLight(0x7c6aff, 0.4);
  fill.position.set(-5, -2, -5); scene.add(fill);
  scene.add(new THREE.GridHelper(10, 20, 0x1a1f35, 0x1a1f35));
  try {
    const fn = new Function("THREE", "scene", code + "\nreturn scene.children.find(c=>c.isMesh||c.isGroup);");
    fn(THREE, scene);
  } catch(e) {
    console.warn("3D code error:", e);
    const geo = new THREE.BoxGeometry(1,1,1);
    const mat = new THREE.MeshStandardMaterial({color:0x7c6aff});
    scene.add(new THREE.Mesh(geo, mat));
  }
  container._threeData = { renderer, scene, camera };
  let isDragging = false, prevX = 0, prevY = 0, rotX = 0, rotY = 0, zoom = 4;
  container.addEventListener("mousedown", e => { isDragging=true; prevX=e.clientX; prevY=e.clientY; });
  window.addEventListener("mouseup", () => isDragging=false);
  window.addEventListener("mousemove", e => {
    if(!isDragging) return;
    rotY += (e.clientX - prevX) * 0.01;
    rotX += (e.clientY - prevY) * 0.01;
    prevX=e.clientX; prevY=e.clientY;
  });
  container.addEventListener("wheel", e => { zoom = Math.max(1, Math.min(10, zoom + e.deltaY*0.01)); });
  let lastTouchX=0, lastTouchY=0;
  container.addEventListener("touchstart", e => { lastTouchX=e.touches[0].clientX; lastTouchY=e.touches[0].clientY; });
  container.addEventListener("touchmove", e => {
    e.preventDefault();
    rotY += (e.touches[0].clientX - lastTouchX) * 0.012;
    rotX += (e.touches[0].clientY - lastTouchY) * 0.012;
    lastTouchX=e.touches[0].clientX; lastTouchY=e.touches[0].clientY;
  }, { passive: false });
  function animate() {
    requestAnimationFrame(animate);
    camera.position.x = zoom * Math.sin(rotY) * Math.cos(rotX);
    camera.position.y = zoom * Math.sin(rotX) + 1;
    camera.position.z = zoom * Math.cos(rotY) * Math.cos(rotX);
    camera.lookAt(0, 0.5, 0);
    renderer.render(scene, camera);
  }
  animate();
}

// ─── REAL .GLB DOWNLOAD ──────────────────────────────────────────
function downloadModel(id) {
  const container = document.getElementById("cw-" + id);
  if (!container || !container._threeData) return;
  const { scene } = container._threeData;
  const exporter = new THREE.GLTFExporter();
  exporter.parse(
    scene,
    (result) => {
      const blob = new Blob([result], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "b2-model.glb";
      a.click();
      URL.revokeObjectURL(url);
    },
    { binary: true }
  );
}

// ─── SYSTEM PROMPT FOR 3D ────────────────────────────────────────
const SYSTEM_3D = `You are a Three.js 3D model code generator.
The user wants a 3D object. Respond with ONLY a JavaScript code block (no explanation, no markdown fences) that:
- Uses the THREE object and scene already available
- Creates geometry, material, and mesh
- Adds the mesh to scene with scene.add(mesh)
- Centers the object around origin (0,0,0)
- Makes it look good with interesting colors or MeshStandardMaterial
- Keep it under 40 lines
- For complex objects combine multiple meshes using THREE.Group
Example for a red sphere:
const geo = new THREE.SphereGeometry(1, 32, 32);
const mat = new THREE.MeshStandardMaterial({color: 0xff4444, roughness: 0.3, metalness: 0.2});
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);`;

// ─── CHAT CORE ────────────────────────────────────────────────────
async function loadState(){
  try{
    const res=await fetch(`${API_BASE}/api/state`);
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||"Could not load chats.");
    profile=data.profile||{username:"You"};
    chats=data.chats||[];
    if(!chats.length){await newChat(false);return;}
    activeChatId=chats[0].id;
    renderProfile();renderRecent();renderChat();
  }catch(err){
    document.getElementById("mwrap").innerHTML=`<div class="empty"><div class="eorb">!</div><h2>Database setup needed</h2><p>${escapeHtml(err.message)}</p></div>`;
  }
}

async function newChat(render=true){
  try{
    const res=await fetch(`${API_BASE}/api/chats`,{method:"POST"});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||"Could not create chat.");
    chats.unshift(data.chat);activeChatId=data.chat.id;
    if(render){renderRecent();renderChat();document.getElementById("inp").focus();}
  }catch(err){alert(err.message);}
}

async function clearCurrentChat(){
  const chat=getActiveChat();
  if(!chat||!chat.messages.length)return;
  if(!confirm("Clear all messages?"))return;
  const res=await fetch(`${API_BASE}/api/chats/${chat.id}/clear`,{method:"POST"});
  const data=await res.json();
  if(!res.ok){alert(data.error||"Could not clear.");return;}
  chat.messages=[];chat.title="New chat";chat.updated_at=new Date().toISOString();
  renderRecent();renderChat();
}

async function deleteCurrentChat(){
  const chat=getActiveChat();
  if(!chat)return;
  if(!confirm(`Delete "${chat.title}"?`))return;
  const res=await fetch(`${API_BASE}/api/chats/${chat.id}/delete`,{method:"DELETE"});
  const data=await res.json();
  if(!res.ok){alert(data.error||"Could not delete.");return;}
  chats=chats.filter(i=>i.id!==activeChatId);
  if(!chats.length){await newChat(false);}
  activeChatId=chats[0].id;renderRecent();renderChat();
}

function selectChat(id){activeChatId=id;renderRecent();renderChat();closeSearch();}

function updateTitleFromFirstMessage(chat){
  const first=chat.messages.find(m=>m.role==="user");
  chat.title=first?first.content.slice(0,38):"New chat";
}

function renderRecent(){
  const list=document.getElementById("recentList");list.innerHTML="";
  chats.sort((a,b)=>new Date(b.updated_at||b.updatedAt)-new Date(a.updated_at||a.updatedAt)).forEach(chat=>{
    const btn=document.createElement("button");
    btn.className=`citem ${chat.id===activeChatId?"on":""}`;
    btn.onclick=()=>selectChat(chat.id);
    btn.innerHTML=`<div class="cdot"></div>${escapeHtml(chat.title)}`;
    list.appendChild(btn);
  });
}

function renderEmpty(){
  document.getElementById("mwrap").innerHTML=`<div class="empty" id="empty">
    <div class="eorb">B2</div><h2>What's on your mind?</h2>
    <p>Ask anything, or try generating a 3D model!</p>
    <div class="chips">
      <button class="chip" onclick="useSug(this)">Generate a 3D crystal</button>
      <button class="chip" onclick="useSug(this)">Generate a 3D rocket</button>
      <button class="chip" onclick="useSug(this)">Explain async/await</button>
      <button class="chip" onclick="useSug(this)">Write a Python script</button>
    </div></div>`;
}

function renderChat(){
  const chat=getActiveChat();
  document.getElementById("chatTitle").textContent=chat?.title||"New chat";
  const wrap=document.getElementById("mwrap");wrap.innerHTML="";
  if(!chat||!chat.messages.length){renderEmpty();return;}
  chat.messages.forEach(m=>addMsg(m.role==="assistant"?"ai":"user",m.content,false));
  document.getElementById("msgs").scrollTop=99999;
}

function addMsg(role,text,appendToHistory=true){
  const e=document.getElementById("empty");if(e)e.remove();
  const d=document.createElement("div");d.className=`msg ${role}`;
  const isAI=role==="ai";
  const name=isAI?"B2":getProfileName();
  const avatar=isAI?"B2":getInitial(name);
  d.innerHTML=`<div class="mhdr"><div class="mav ${role}">${avatar}</div><span class="mname">${escapeHtml(name)}</span><span class="mtime">${gt()}</span></div><div class="mbody">${escapeHtml(text)}</div>`;
  document.getElementById("mwrap").appendChild(d);
  document.getElementById("msgs").scrollTop=99999;
  return d;
}

function add3DMsg(code, label){
  const e=document.getElementById("empty");if(e)e.remove();
  const d=document.createElement("div");d.className="msg ai";
  const viewer=create3DViewer(code,label);
  d.innerHTML=`<div class="mhdr"><div class="mav ai">B2</div><span class="mname">B2</span><span class="mtime">${gt()}</span></div><div class="mbody">Here's your 3D model — drag to rotate, scroll to zoom!</div>`;
  d.appendChild(viewer);
  document.getElementById("mwrap").appendChild(d);
  document.getElementById("msgs").scrollTop=99999;
}

function showTyping(){
  const e=document.getElementById("empty");if(e)e.remove();
  const d=document.createElement("div");d.className="msg ai";d.id="typing";
  d.innerHTML=`<div class="mhdr"><div class="mav ai">B2</div><span class="mname">B2</span></div><div class="mbody"><div class="tdots"><span></span><span></span><span></span></div></div>`;
  document.getElementById("mwrap").appendChild(d);
  document.getElementById("msgs").scrollTop=99999;
}
function hideTyping(){const t=document.getElementById("typing");if(t)t.remove();}
function useSug(b){const inp=document.getElementById("inp");inp.value=b.textContent;resize(inp);send();}

function onKey(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
  if(e.key.toLowerCase()==="k"&&(e.metaKey||e.ctrlKey)){e.preventDefault();openSearch();}
}

async function send(){
  if(busy)return;
  const inp=document.getElementById("inp");
  const txt=inp.value.trim();if(!txt)return;
  const chat=getActiveChat();
  inp.value="";inp.style.height="auto";
  busy=true;document.getElementById("sbtn").disabled=true;
  addMsg("user",txt);
  chat.messages.push({role:"user",content:txt});
  chat.updated_at=new Date().toISOString();
  updateTitleFromFirstMessage(chat);
  renderRecent();document.getElementById("chatTitle").textContent=chat.title;
  showTyping();

  if(is3DRequest(txt)){
    try{
      const res=await fetch(`${API_BASE}/api/chat`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:[{role:"system",content:SYSTEM_3D},{role:"user",content:txt}]})
      });
      const data=await res.json();
      hideTyping();
      const clean=(data.message||"").replace(/```[\w]*\n?/g,"").replace(/```/g,"").trim();
      add3DMsg(clean, txt);
      chat.messages.push({role:"assistant",content:"[3D model generated]"});
      chat.updated_at=new Date().toISOString();
    }catch(err){
      hideTyping();
      addMsg("ai",`Error generating 3D model: ${err.message}`);
    }
    busy=false;document.getElementById("sbtn").disabled=false;inp.focus();
    return;
  }

  try{
    const res=await fetch(`${API_BASE}/api/chat`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:chat.id,content:txt})});
    const raw=await res.text();
    let data={};
    if(raw){try{data=JSON.parse(raw);}catch{throw new Error(`Non-JSON response: ${raw.slice(0,120)}`);}}
    else{throw new Error("Empty response from server.");}
    hideTyping();
    if(!res.ok)throw new Error(data.error||"The request failed.");
    const reply=data.message||"No response.";
    chat.messages.push({role:"assistant",content:reply});
    chat.updated_at=new Date().toISOString();
    addMsg("ai",reply);
  }catch(err){
    hideTyping();
    addMsg("ai",`Error: ${err.message}`);
  }
  busy=false;document.getElementById("sbtn").disabled=false;inp.focus();
}

function openSearch(){document.getElementById("searchOverlay").hidden=false;document.getElementById("searchInput").focus();renderSearchResults();}
function closeSearch(event){if(event&&event.target.id!=="searchOverlay")return;document.getElementById("searchOverlay").hidden=true;}

function renderSearchResults(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const box=document.getElementById("searchResults");
  const results=chats.filter(chat=>{
    const hay=[chat.title,...chat.messages.map(m=>m.content)].join(" ").toLowerCase();
    return !q||hay.includes(q);
  });
  box.innerHTML=results.length?"":`<div class="empty-results">No chats found.</div>`;
  results.forEach(chat=>{
    const hit=chat.messages.find(m=>!q||m.content.toLowerCase().includes(q));
    const btn=document.createElement("button");btn.className="sres";
    btn.onclick=()=>selectChat(chat.id);
    btn.innerHTML=`<div class="sres-title">${escapeHtml(chat.title)}</div><div class="sres-text">${escapeHtml(hit?hit.content.slice(0,120):"No messages yet.")}</div>`;
    box.appendChild(btn);
  });
}

function getProfile(){return profile||{username:"You"};}
function getProfileName(){return getProfile().username||"You";}
function getInitial(name){return(name.trim()[0]||"Y").toUpperCase();}
function renderProfile(){
  const name=getProfileName();
  document.getElementById("profileName").textContent=name;
  document.getElementById("profileInitial").textContent=getInitial(name);
  document.getElementById("usernameInput").value=name;
}
function toggleProfile(force){
  const menu=document.getElementById("profileMenu");
  menu.hidden=typeof force==="boolean"?!force:!menu.hidden;
  if(!menu.hidden)document.getElementById("usernameInput").focus();
}
async function saveProfile(){
  const input=document.getElementById("usernameInput");
  const username=input.value.trim()||"You";
  const res=await fetch(`${API_BASE}/api/profile`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
  const data=await res.json();
  if(!res.ok){alert(data.error||"Could not save.");return;}
  profile=data.profile;renderProfile();renderChat();toggleProfile(false);
}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSearch();toggleProfile(false);}});
document.addEventListener("click",e=>{
  const menu=document.getElementById("profileMenu");
  const foot=document.querySelector(".sb-foot");
  if(!menu.hidden&&!foot.contains(e.target))toggleProfile(false);
});

loadState();
</script>
